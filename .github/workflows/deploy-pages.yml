name: Deploy do GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write        # autoryzacja OIDC - zero sekretow do wgrywania

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Bramka: strona nie pojdzie na produkcje, jesli silnik przestanie odtwarzac
  # zmierzony rok. To jedyne zabezpieczenie przed cichym zepsuciem wynikow.
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test "test/*.test.mjs"

  deploy:
    needs: testy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
